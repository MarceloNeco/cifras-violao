<!DOCTYPE html>
<html lang="pt-BR" data-tema="claro">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Cifra</title>
<meta name="theme-color" content="#a8501e">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icone-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="CifrasONE">
<link rel="stylesheet" href="estilo.css">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎸</text></svg>">
</head>
<body data-pagina="cifra">

<header class="topo">
  <div class="topo-interno"></div>
</header>

<!-- faixa fina que aparece só no modo celular -->
<div class="faixa-palco" id="faixa-palco">
  <span class="nome" id="nome-palco"></span>
  <span class="espaco"></span>
  <span class="valor" id="tom-palco"></span>
  <button class="botao icone" id="sair-palco" data-i18n-title="cifra.sairPalco">✕</button>
</div>

<main class="conteudo" data-dgo-ignorar>
  <div class="cabecalho-musica">
    <h1 id="titulo" data-i18n="cifra.carregando">Carregando…</h1>
    <div class="meta" id="meta"></div>
  </div>

  <div class="ouvir" id="ouvir"></div>

  <div class="fixavel" id="fixavel">
  <div class="painel" id="painel">
    <div class="grupo">
      <span class="rotulo some-no-palco" data-i18n="cifra.tom">Tom</span>
      <button class="botao icone" id="tom-menos" data-i18n-title="cifra.abaixar">−</button>
      <span class="valor" id="tom-atual">C</span>
      <button class="botao icone" id="tom-mais" data-i18n-title="cifra.subir">+</button>
      <button class="botao icone some-no-palco secundario" id="tom-zero" data-i18n-title="cifra.tomOriginal">↺</button>
    </div>

    <div class="grupo some-no-palco secundario">
      <span class="rotulo" data-i18n="cifra.capo">Capo</span>
      <button class="botao icone" id="capo-menos" data-i18n-title="cifra.capoMenos">−</button>
      <span class="valor" id="capo-atual">0</span>
      <button class="botao icone" id="capo-mais" data-i18n-title="cifra.capoMais">+</button>
    </div>

    <div class="grupo">
      <button class="botao" id="btn-rolar" title="Play (barra de espaço)">▶ Play</button>
      <input class="velocidade" id="velocidade" type="range" min="1" max="30" value="8"
             data-i18n-aria="cifra.velocidade" aria-label="Velocidade da rolagem">
      <span class="valor" id="velocidade-valor">8</span>
    </div>

    <div class="grupo secundario">
      <button class="botao" id="btn-guia" aria-pressed="false"
              data-i18n="cifra.guia" data-i18n-title="cifra.guiaTitulo">◉ Guia</button>
      <button class="botao icone" id="btn-guia-som" aria-pressed="false" hidden
              data-i18n-title="cifra.guiaSom">🔇</button>
      <button class="botao icone" id="btn-voz" aria-pressed="false"
              data-i18n-title="cifra.voz" data-i18n-aria="cifra.voz">🗣</button>
    </div>

    <div class="grupo">
      <span class="rotulo some-no-palco" data-i18n="cifra.letra">Letra</span>
      <button class="botao icone" id="fonte-menos" data-i18n-title="cifra.menor">A−</button>
      <button class="botao icone" id="fonte-mais" data-i18n-title="cifra.maior">A+</button>
      <button class="botao icone secundario" id="btn-caber" data-i18n-title="cifra.caber">⤢</button>
    </div>

    <div class="grupo some-no-palco">
      <button class="botao so-no-computador secundario" id="btn-so-cifra" aria-pressed="false"
              data-i18n-title="cifra.soCifraTitulo">▤ Só a cifra</button>
      <button class="botao" id="btn-palco" data-i18n-title="cifra.palcoTitulo" data-i18n-aria="cifra.palcoTitulo">📱<span class="so-pc-inline" data-i18n="cifra.palcoTexto"> Modo celular</span></button>
    </div>

    <!-- só no celular: abre a segunda linha (capo, guia, voz, ajustar, sair) -->
    <button class="botao icone so-celular-inline" id="btn-mais" type="button" aria-expanded="false"
            data-i18n-title="cifra.mais" data-i18n-aria="cifra.mais">⋯</button>
  </div>

  <div class="diagramas" id="diagramas"></div>
  </div>

  <div class="cifra" id="cifra"></div>
</main>

<!-- afinador -->
<div class="gaveta" id="afinador" aria-hidden="true">
  <div class="gaveta-interna">
    <h2 data-i18n="afinador.titulo">Afinador</h2>
    <p data-i18n="afinador.texto">Toque numa corda para ouvir a nota certa e afinar de ouvido.</p>
    <div class="cordas" id="cordas"></div>
    <div style="text-align:center;margin-top:12px">
      <button class="botao" id="fechar-afinador" data-i18n="afinador.fechar">Fechar</button>
    </div>
  </div>
</div>

<footer class="rodape" data-dgo-ignorar>
  <span data-i18n="cifra.rodape">Espaço = Play/Pause · setas ↑ ↓ = velocidade · + e − = tom</span>
</footer>

<script src="idioma.js"></script>
<!-- Diretrizes gerais (módulo comum SolverONE): idioma, anúncios, conta,
     avisos, nuvem, IA, AssistONE e instalação. O diretrizes.js é igual em
     todos os apps; o que muda é só o diretrizes-config.js. -->
<script src="diretrizes.js"></script>
<script src="diretrizes-config.js"></script>
<script src="acordes.js"></script>
<script src="comum.js"></script>
<script src="aviso.js"></script>
<script src="leitor.js"></script>
</body>
</html>
