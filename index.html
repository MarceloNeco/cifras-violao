  async createInvite(o) {
    const code = this.newCode(12);
    const doc = { code, createdAt: new Date().toISOString(), createdByUid: S.user.uid, createdByName: this.myName(), role: o.role || "membro", personId: o.personId || "", forName: o.forName || "", maxUses: +o.maxUses || 1, uses: 0, expiresAt: Date.now() + (+o.ttlH || 72) * 3600e3, active: true, need: this.need() };
    await FB.F.setDoc(FB.ref("families", S.family.id, "invites", code), doc);
    await this.audit("convite.criado", roleName(doc.role) + (doc.forName ? " · " + doc.forName : "") + " · " + doc.maxUses + "× · " + (+o.ttlH || 72) + "h");
    return doc;
  },
  async revokeInvite(code) { await FB.F.updateDoc(FB.ref("families", S.family.id, "invites", code), { active: false }); await this.audit("convite.revogado", code.slice(0, 4) + "…"); },
  /* a) pedido do convidado */
  async requestJoin(inv) {
    const F = FB.F, u = S.user;
    let iv = null; try { const s = await F.getDoc(FB.ref("families", inv.fid, "invites", inv.code)); iv = s.exists() ? s.data() : null; } catch (e) { iv = null; }
    const bad = !iv ? "invalid" : !iv.active ? "revoked" : iv.expiresAt < Date.now() ? "expired" : (iv.uses || 0) >= (iv.maxUses || 1) ? "used" : null;
    if (bad) return bad;
    const verify = String(1000 + (crypto.getRandomValues(new Uint32Array(1))[0] % 9000));
    await F.setDoc(FB.ref("families", inv.fid, "joinRequests", u.uid), { uid: u.uid, name: u.name || "", email: u.email || "", photo: u.photo || "", at: new Date().toISOString(), code: inv.code, verify, role: iv.role, personId: iv.personId || "", forName: iv.forName || "", by: iv.createdByName || inv.by || "", need: iv.need || 1, approvals: {}, tries: 0 });
    await F.setDoc(FB.ref("users", u.uid), { pending: inv.fid, pendingName: inv.n || "", email: u.email || "", name: u.name || "" }, { merge: true });
    return null;
  },
  async cancelRequest(fid) {
    try { await FB.F.deleteDoc(FB.ref("families", fid, "joinRequests", S.user.uid)); } catch (e) {}
    try { await FB.F.setDoc(FB.ref("users", S.user.uid), { pending: FB.F.deleteField(), pendingName: FB.F.deleteField() }, { merge: true }); } catch (e) {}
  },
  /* b) aprovação (1 ou 2 chefes/responsáveis) */
  async approve(req, o) {
    const F = FB.F, me = S.user.uid;
    const approvals = Object.assign({}, req.approvals || {}, { [me]: { name: this.myName(), at: new Date().toISOString() } });
    const need = this.need();
    if (Object.keys(approvals).length < need) {
      await F.updateDoc(FB.ref("families", S.family.id, "joinRequests", req.uid), { approvals, proposal: { role: o.role, personId: o.personId || "", consent: o.consent || null }, verified: true });
      await this.audit("entrada.aprovacao", (req.name || req.email) + " · " + Object.keys(approvals).length + "/" + need);
      toast(tt("Sua aprovação foi registrada. Falta a confirmação de outro chefe/responsável.", "Your approval was recorded. Another head/guardian still has to confirm."), 5000);
      return;
    }
    let personId = o.personId;
    const pRole = o.role === "crianca" ? "crianca" : (o.role === "admin" || o.role === "responsavel" ? "responsavel" : "adulto");
    const extra = o.role === "crianca" && o.consent ? { consent: o.consent } : {};
    if (!personId) { personId = uid("p"); await DB.put("people", Object.assign({ id: personId, name: req.name || req.email || "Membro", role: pRole, uid: req.uid, color: COLORS[Math.floor(Math.random() * COLORS.length)], email: req.email || "" }, extra)); }
    else { const p = People.get(personId); if (p) await DB.put("people", Object.assign({}, p, { uid: req.uid, email: p.email || req.email || "" }, extra)); }
    await F.updateDoc(FB.ref("families", S.family.id), { ["members." + req.uid]: { role: o.role, personId, name: req.name || "", email: req.email || "", since: new Date().toISOString(), invitedBy: req.by || "", approvedBy: Object.values(approvals).map((a) => a.name) } });
    try { await F.updateDoc(FB.ref("families", S.family.id, "invites", req.code), { uses: F.increment(1) }); const s = await F.getDoc(FB.ref("families", S.family.id, "invites", req.code)); if (s.exists() && s.data().uses >= s.data().maxUses) await F.updateDoc(FB.ref("families", S.family.id, "invites", req.code), { active: false }); } catch (e) { console.warn(e); }
    await F.deleteDoc(FB.ref("families", S.family.id, "joinRequests", req.uid));
    await this.audit("entrada.aprovada", (req.name || req.email) + " · " + roleName(o.role) + (o.consent ? " · " + tt("consentimento registrado", "consent recorded") : ""));
    toast(tt("Entrada aprovada ✓", "Approved ✓"));
  },
  async reject(req, why) { await FB.F.deleteDoc(FB.ref("families", S.family.id, "joinRequests", req.uid)); await this.audit("entrada.recusada", (req.name || req.email) + (why ? " · " + why : "")); },
  /* c) papéis: só chefes mudam; sempre fica pelo menos um chefe; o criador é sempre chefe */
  async setRole(uidM, role) {
    const m = S.family.members[uidM]; if (!m) return;
    if (uidM === S.family.owner && role !== "admin") return toast(tt("O criador da família é sempre chefe. Para mudar, passe a criação para outro chefe.", "The family creator is always a head. To change that, hand over ownership to another head."), 5000);
    if (m.role === "admin" && role !== "admin" && this.admins().length <= 1) return toast(tt("A família precisa de pelo menos um chefe.", "The family needs at least one head."));
    await FB.F.updateDoc(FB.ref("families", S.family.id), { ["members." + uidM + ".role"]: role });
    const p = People.get(m.personId); if (p) { const pr = role === "crianca" ? "crianca" : (role === "membro" ? (p.role === "responsavel" ? "adulto" : p.role) : "responsavel"); if (pr !== p.role) await DB.put("people", Object.assign({}, p, { role: pr })); }
    await this.audit("papel.alterado", (m.name || m.email) + ": " + roleName(m.role) + " → " + roleName(role));
    toast(tt("Papel atualizado ✓", "Role updated ✓"));
  },
  async removeMember(uidM) { const m = S.family.members[uidM]; await FB.F.updateDoc(FB.ref("families", S.family.id), { ["members." + uidM]: FB.F.deleteField() }); await this.audit("membro.removido", m ? m.name || m.email : uidM); },
  async leave() {
    await this.audit("membro.saiu", this.myName());
    await FB.F.updateDoc(FB.ref("families", S.family.id), { ["members." + S.user.uid]: FB.F.deleteField() });
    try { await FB.F.setDoc(FB.ref("users", S.user.uid), { lastFamily: FB.F.deleteField(), families: FB.F.arrayRemove(S.family.id) }, { merge: true }); } catch (e) {}
    lsDel(LS.lastFam); toast(tt("Você saiu da família.", "You left the family.")); ACT["cloud.logout"]();
  },
  async transferOwner(uidM) {
    const m = S.family.members[uidM]; if (!m || m.role !== "admin") return toast(tt("Primeiro torne a pessoa chefe.", "Make the person a head first."));
    await FB.F.updateDoc(FB.ref("families", S.family.id), { owner: uidM });
    await this.audit("criacao.transferida", this.myName() + " → " + (m.name || m.email));
    toast(tt("Criação da família transferida ✓", "Family ownership transferred ✓"));
  },
  async setPolicy(p) { await FB.F.updateDoc(FB.ref("families", S.family.id), { policy: Object.assign({}, this.policy(), p) }); await this.audit("regras.alteradas", JSON.stringify(p)); }
};

const RULES_TEXT = `rules_version = '2';
service cloud.firestore {
  match /databases/{database}/documents {
    function signedIn() { return request.auth != null; }
    function fam(fid) { return get(/databases/$(database)/documents/families/$(fid)).data; }
    function isMember(fid) { return signedIn() && request.auth.uid in fam(fid).members; }
    function myRole(fid) { return fam(fid).members[request.auth.uid].role; }
    function isAdmin(fid) { return isMember(fid) && myRole(fid) == 'admin'; }
    function isGuardian(fid) { return isMember(fid) && myRole(fid) in ['admin', 'responsavel']; }
    function isAdult(fid) { return isMember(fid) && myRole(fid) in ['admin', 'responsavel', 'membro']; }
    function visOk(fid, data) { return isGuardian(fid) || data.vis != 'restrito'; }
    function inviteOk(fid, code) {
      let p = /databases/$(database)/documents/families/$(fid)/invites/$(code);
      return exists(p) && get(p).data.active == true && get(p).data.expiresAt > request.time.toMillis() && get(p).data.uses < get(p).data.maxUses;
    }

    match /users/{uid} {
      allow read, write: if signedIn() && request.auth.uid == uid;
    }
    match /families/{fid} {
      allow read: if isMember(fid);
      allow create: if signedIn()
        && request.resource.data.owner == request.auth.uid
        && request.resource.data.members.keys().hasOnly([request.auth.uid])
        && request.resource.data.members[request.auth.uid].role == 'admin';

      // Chefes (admin): mudam tudo, mas o criador continua chefe e só ele passa a criação para outro chefe.
      function ownerOk() {
        let o = request.resource.data.owner;
        return o in request.resource.data.members && request.resource.data.members[o].role == 'admin'
          && (o == resource.data.owner || request.auth.uid == resource.data.owner);
      }
      // Responsáveis: só podem aprovar a entrada de membro adulto ou criança (um por vez).
      function guardianAddsMember() {
        let d = request.resource.data.diff(resource.data);
        let m = request.resource.data.members.diff(resource.data.members);
        return d.affectedKeys().hasOnly(['members']) && m.removedKeys().size() == 0 && m.changedKeys().size() == 0
          && m.addedKeys().size() == 1 && request.resource.data.members[m.addedKeys().toList()[0]].role in ['membro', 'crianca'];
      }
      // Qualquer um (menos o criador) pode sair da família sozinho.
      function leavingSelf() {
        let d = request.resource.data.diff(resource.data);
        let m = request.resource.data.members.diff(resource.data.members);
        return d.affectedKeys().hasOnly(['members']) && m.addedKeys().size() == 0 && m.changedKeys().size() == 0
          && m.removedKeys().hasOnly([request.auth.uid]) && request.auth.uid != resource.data.owner;
      }
      allow update: if (isAdmin(fid) && ownerOk()) || (isGuardian(fid) && guardianAddsMember()) || (isMember(fid) && leavingSelf());
      allow delete: if signedIn() && resource.data.owner == request.auth.uid;

      // Convites: quem tem o código (o segredo) consegue ler aquele convite; só chefes e responsáveis criam e revogam.
      match /invites/{code} {
        allow get: if signedIn();
        allow list, create, update, delete: if isGuardian(fid);
      }
      // Pedido de entrada: só com convite válido (ativo, dentro do prazo e com vagas).
      match /joinRequests/{uid} {
        allow create: if signedIn() && request.auth.uid == uid && request.resource.data.code is string && inviteOk(fid, request.resource.data.code);
        allow update: if isGuardian(fid);
        allow read, delete: if (signedIn() && request.auth.uid == uid) || isGuardian(fid);
      }
      // Histórico de segurança: só se acrescenta; ninguém edita nem apaga.
      match /audit/{id} {
        allow read: if isGuardian(fid);
        allow create: if isMember(fid) && request.resource.data.byUid == request.auth.uid;
      }
      match /vault/{id} {
        allow read, write: if isGuardian(fid);
      }
      match /requests/{id} {
        allow read: if isMember(fid) && visOk(fid, resource.data);
        allow create: if isMember(fid) && request.resource.data.byUid == request.auth.uid;
        allow update: if isGuardian(fid) || (isMember(fid) && resource.data.byUid == request.auth.uid)
          || (isAdult(fid) && request.resource.data.diff(resource.data).affectedKeys().hasOnly(['status', 'boughtAt', 'updatedAt', 'updatedBy']));
        allow delete: if isGuardian(fid) || (isMember(fid) && resource.data.byUid == request.auth.uid);
      }
      match /files/{fileId}/chunks/{n} {
        allow read: if isMember(fid) && visOk(fid, resource.data);
        allow write: if isMember(fid);
      }
      match /{col}/{id} {
        allow read: if !(col in ['vault', 'joinRequests', 'invites', 'audit']) && isMember(fid) && visOk(fid, resource.data);
        allow create, update: if !(col in ['vault', 'requests', 'joinRequests', 'invites', 'audit'])
          && (isAdult(fid) || (isMember(fid) && col in ['tasks', 'shop', 'items', 'msgs', 'reminders', 'files', 'checkins']));
        allow delete: if !(col in ['vault', 'requests', 'joinRequests', 'invites', 'audit']) && isAdult(fid);
      }
    }
  }
}`;

/* ---------- cofre criptografado (AES-GCM 256 + PBKDF2) ---------- */
const Vault = {
  meta() { return DB.col("vault").get("_meta"); },
  famKey() { return "vaultKey:" + (S.family ? S.family.id : "local"); },
  async derive(pass, salt, iter) {
    const base = await crypto.subtle.importKey("raw", new TextEncoder().encode(pass), "PBKDF2", false, ["deriveKey"]);
    return crypto.subtle.deriveKey({ name: "PBKDF2", salt: bufFromB64(salt), iterations: iter, hash: "SHA-256" }, base, { name: "AES-GCM", length: 256 }, false, ["encrypt", "decrypt"]);
  },
  async setup(pass) {
    const salt = b64FromBuf(crypto.getRandomValues(new Uint8Array(16))); const iter = 310000;
    const key = await this.derive(pass, salt, iter);
    const check = await this.encStr("omnilife-ok", key);
    await DB.put("vault", { id: "_meta", salt, iter, check, vis: "restrito" });
    S.vaultKey = key;
  },
  async unlock(pass) {
    const m = this.meta(); if (!m) return false;
    const key = await this.derive(pass, m.salt, m.iter);
    try { if ((await this.decStr(m.check, key)) !== "omnilife-ok") return false; S.vaultKey = key; return true; } catch (e) { return false; }
  },
  lock() { S.vaultKey = null; Files.urls.clear(); },
  async encStr(str, key) { key = key || S.vaultKey; const iv = crypto.getRandomValues(new Uint8Array(12)); const ct = await crypto.subtle.encrypt({ name: "AES-GCM", iv }, key, new TextEncoder().encode(str)); return { iv: b64FromBuf(iv), ct: b64FromBuf(ct) }; },
  async decStr(o, key) { key = key || S.vaultKey; const pt = await crypto.subtle.decrypt({ name: "AES-GCM", iv: bufFromB64(o.iv) }, key, bufFromB64(o.ct)); return new TextDecoder().decode(pt); },
  async encObj(obj) { return this.encStr(JSON.stringify(obj)); },
  async decObj(o) { return JSON.parse(await this.decStr(o)); },
  async encryptBlob(blob) { if (!S.vaultKey) throw new Error("vault-locked"); const iv = crypto.getRandomValues(new Uint8Array(12)); const ct = await crypto.subtle.encrypt({ name: "AES-GCM", iv }, S.vaultKey, await blob.arrayBuffer()); return { blob: new Blob([ct], { type: "application/octet-stream" }), iv: b64FromBuf(iv) }; },
  async decryptBlob(blob, iv, type) { const pt = await crypto.subtle.decrypt({ name: "AES-GCM", iv: bufFromB64(iv) }, S.vaultKey, await blob.arrayBuffer()); return new Blob([pt], { type: type || "application/octet-stream" }); },
  async rememberBio() { if (!S.vaultKey) return false; if (!Bio.cred()) { try { await Bio.register(); } catch (e) { toast(tt("Biometria indisponível neste aparelho.", "Biometrics unavailable on this device.")); return false; } } await IDB.set("kv", this.famKey(), S.vaultKey); toast(tt("Cofre liberado por biometria neste aparelho ✓", "Vault unlocks with biometrics on this device ✓")); return true; },
  async hasBio() { try { return !!(await IDB.get("kv", this.famKey())) && !!Bio.cred(); } catch (e) { return false; } },
  async unlockBio() {
    const k = await IDB.get("kv", this.famKey()); if (!k) return false;
    if (!(await Bio.verify())) return false;
    try { await this.decStr(this.meta().check, k); S.vaultKey = k; return true; } catch (e) { return false; }
  },
  async forgetBio() { await IDB.del("kv", this.famKey()); }
};

/* ---------- biometria (WebAuthn, digital/rosto do aparelho) ---------- */
const Bio = {
  async available() { try { return !!(window.PublicKeyCredential && await PublicKeyCredential.isUserVerifyingPlatformAuthenticatorAvailable()); } catch (e) { return false; } },
  cred() { return lsGet(LS.webauthn, null); },
  async register() { const id = await this.create(); lsSet(LS.webauthn, { id }); return true; },
  /* credencial do perfil (modo "só neste aparelho"): liga a digital/rosto ao perfil de quem ativou */
  profId(pid) { return (lsGet("omnilife.bioProfiles.v1", {}) || {})[pid] || null; },
  async enrollProfile(pid) { const id = await this.create(); const m = lsGet("omnilife.bioProfiles.v1", {}) || {}; m[pid] = id; lsSet("omnilife.bioProfiles.v1", m); return true; },
  forgetProfile(pid) { const m = lsGet("omnilife.bioProfiles.v1", {}) || {}; delete m[pid]; lsSet("omnilife.bioProfiles.v1", m); },
  async create() {
    const c = await navigator.credentials.create({ publicKey: {
      challenge: crypto.getRandomValues(new Uint8Array(32)), rp: { name: APP_NAME },
      user: { id: crypto.getRandomValues(new Uint8Array(16)), name: (S.user && S.user.email) || "omnilife", displayName: People.name(S.meId) || APP_NAME },
      pubKeyCredParams: [{ type: "public-key", alg: -7 }, { type: "public-key", alg: -257 }],
      authenticatorSelection: { authenticatorAttachment: "platform", userVerification: "required", residentKey: "preferred" }, timeout: 60000 } });
    return b64FromBuf(c.rawId);
  },
  async verify(id) {
    if (!id) { const c = this.cred(); if (!c) return false; id = c.id; }
    try { const r = await navigator.credentials.get({ publicKey: { challenge: crypto.getRandomValues(new Uint8Array(32)), allowCredentials: [{ type: "public-key", id: bufFromB64(id) }], userVerification: "required", timeout: 60000 } }); return !!r; }
    catch (e) { return false; }
  },
  forget() { lsDel(LS.webauthn); }
};

/* ---------- avisos (notificações do navegador + ntfy opcional) ---------- */
const Notify = {
  reg: null,
  async init() {
    if ("serviceWorker" in navigator && /^https?:/.test(location.protocol)) {
      try { this.reg = await navigator.serviceWorker.register("sw.js"); } catch (e) { this.reg = null; }
    }
    setInterval(() => this.tick(), 60000);
    setTimeout(() => this.tick(), 4000);
  },
  perm() { return "Notification" in window ? Notification.permission : "unsupported"; },
  async ask() {
    if (!("Notification" in window)) { toast(tt("Este navegador não suporta avisos.", "This browser doesn't support notifications.")); return false; }
    const p = await Notification.requestPermission();
    if (p === "granted") { this.show(APP_NAME, tt("Avisos ligados ✓", "Notifications on ✓"), "test"); return true; }
    toast(tt("Avisos bloqueados. Libere nas configurações do navegador.", "Notifications blocked. Allow them in browser settings.")); return false;
  },
  async show(title, body, tag, url) {
    if (S.mode === "visitor" && tag !== "test") { toast("🔔 " + title + (body ? " — " + body : ""), 4200); return; }
    if (document.visibilityState === "visible") toast("🔔 " + title + (body ? " — " + body : ""), 4200);
    if (this.perm() !== "granted") return;
    try {
      const reg = this.reg || (navigator.serviceWorker && await navigator.serviceWorker.getRegistration());
      if (reg) await reg.showNotification(title, { body: body || "", tag: tag || undefined, icon: "icon-192.png", badge: "icon-192.png", data: { url: url || location.href.split("#")[0] } });
      else new Notification(title, { body: body || "", tag: tag || undefined });
    } catch (e) {}
  },
  once(key, title, body) {
    const n = lsGet(LS.notified, {}); if (n[key]) return;
    n[key] = Date.now();
    const cut = Date.now() - 60 * 864e5; for (const k in n) if (n[k] < cut) delete n[k];
    lsSet(LS.notified, n); this.show(title, body, key);
  },
  async ntfy(title, body, force) {
    const topic = DB.setting().ntfyTopic; if (!topic) return false;
    try {
      const r = await fetch("https://ntfy.sh/", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ topic, title, message: body || title, tags: ["house"], click: location.href.split("#")[0] }) });
      return r.ok;
    } catch (e) { return false; }
  },
  onRemote(col, d, type) {
    if (!S.booted) return;
    if (col === "requests" && type === "added" && isGuardian() && d.status === "pendente" && d.by !== S.meId) this.show(tt("Novo pedido de ", "New request from ") + People.name(d.by), d.name, "req-" + d.id);
    if (col === "requests" && type === "modified" && d.by === S.meId && d.status !== "pendente") this.show(d.status === "recusado" ? tt("Pedido recusado", "Request declined") : tt("Pedido aprovado 🎉", "Request approved 🎉"), d.name, "reqd-" + d.id + d.status);

const Ads = {
  list: null, cfg: { velocidade: 40, popupAntesDoLogin: true, popupDepoisDoLogin: true, segundosParaFechar: 3, intervaloMinutos: 30 },
  SELF: ["omnilife-one", "omnilife", "omnilifeone"],

  img(a, cls) { const e = esc(a.emoji || "✨"); return a.imagem ? '<img class="' + cls + '" src="' + esc(a.imagem) + '" alt="" loading="lazy" onerror="this.outerHTML=\'<span class=&quot;' + cls + '&quot;>' + e + '</span>\'">' : '<span class="' + cls + '" aria-hidden="true">' + e + "</span>"; },

function pinPad(title) {

}

async function selectProfile(id) {
  const p = People.get(id); if (!p) return false;
  /* digital/rosto primeiro (se ativada e se a pessoa não escolheu "sempre PIN"); se falhar, cai para o PIN.
     Quem entrou pela digital não é perguntado de novo pela trava do app. */
  const how = S.prefs.loginHow || "auto"; const bid = Bio.profId(p.id);
  let byBio = false;
  if (how !== "pin" && bid) byBio = await Bio.verify(bid);
  if (p.pinHash && !byBio) {
    const pin = await pinPad(tt("PIN de ", "PIN for ") + (p.nick || p.name));
    if (pin == null) return false;
    if ((await sha256(pin + p.id)) !== p.pinHash) { toast(tt("PIN incorreto.", "Wrong PIN.")); return false; }
    if (how !== "pin" && !bid && !(S.prefs.bioAsked || {})[p.id] && await Bio.available()) {
      S.prefs.bioAsked = Object.assign({}, S.prefs.bioAsked, { [p.id]: 1 }); savePrefs();
      if (await confirmBox("👆 " + tt("Entrar com a digital ou o rosto nas próximas vezes, em vez do PIN? (Dá para mudar em Ajustes → Geral → Segurança.)", "Sign in with fingerprint or face next time instead of the PIN? (You can change it in Settings → General → Security.)"), tt("Usar digital", "Use fingerprint"))) {
        try { await Bio.enrollProfile(p.id); toast(tt("Pronto: da próxima vez é só a digital ✓", "Done: next time just use your fingerprint ✓")); } catch (e) { toast(tt("A digital não foi ativada neste aparelho.", "Fingerprint not enabled on this device.")); }
      }
    }
  }
  if (byBio) S.unlocked = true;
  S.meId = id; S.role = localRole(p); lsSet(LS.localMe, id); return true;
}
function localRole(p) { if (!p) return "membro"; if (p.role === "responsavel") return p.isAdmin ? "admin" : "responsavel"; if (p.role === "crianca") return "crianca"; return "membro"; }

function guessCat(name) {
  const n = norm(name); if (!n) return "outros";
  let best = "outros", bl = 0;
  for (const c in CAT_KW) for (const kw of CAT_KW[c].split(" ")) { const k = norm(kw); if (k.length > 2 && (n === k || n.startsWith(k + " ") || n.includes(" " + k) || n.startsWith(k)) && k.length > bl) { best = c; bl = k.length; } }
  return best;
}

/* ---------- despensa + previsão de reposição ---------- */
const Pantry = {
  items() { return DB.all("items"); },
  byName(name) { const n = norm(name); return this.items().find((i) => norm(i.name) === n); },
  cycle(it) {
    if (it.cycleDays) return { days: +it.cycleDays, n: 0, src: "manual" };
    const outs = (it.outs || []).slice().sort();
    const ev = outs.length >= 2 ? outs : (it.history || []).map((h) => h.d).sort();
    if (ev.length < 2) return null;
    const gaps = [];
    for (let i = 1; i < ev.length; i++) { const g = diffDays(ev[i - 1], ev[i]); if (g > 0) gaps.push(g); }
    if (!gaps.length) return null;
    let w = 0, s = 0; gaps.forEach((g, i) => { const wi = Math.pow(1.6, i); w += wi; s += g * wi; });
    return { days: Math.max(1, Math.round(s / w)), n: gaps.length, src: outs.length >= 2 ? "outs" : "buys" };
  },
  lastBuy(it) { const h = (it.history || []).map((x) => x.d).sort(); return h[h.length - 1] || null; },
  predict(it) {
    if (it.status === "acabou") return { days: 0, date: today(), cycle: this.cycle(it) };
    const c = this.cycle(it); const lb = this.lastBuy(it);
    if (!c || !lb) return null;
    const date = addDays(lb, c.days); return { days: diffDays(today(), date), date, cycle: c };
  },
  soon(within) {
    within = within == null ? 3 : within;
    return this.items().map((it) => { const p = this.predict(it); return Object.assign({}, it, { _days: p ? p.days : (it.status === "baixo" ? 1 : null), _pred: p }); })
      .filter((it) => it.track !== false && ((it._days != null && it._days <= within) || it.status === "baixo" || it.status === "acabou"))
      .filter((it) => !Shop.onList(it)).sort((a, b) => (a._days == null ? 99 : a._days) - (b._days == null ? 99 : b._days));
  },
  async setStatus(id, st) {
    const it = DB.get("items", id); if (!it) return;
    const n = Object.assign({}, it, { status: st });
    if (st === "acabou") { n.outs = (it.outs || []).concat(today()).slice(-20); if (DB.setting().autoAdd !== false && !Shop.onList(it)) await Shop.add({ name: it.name, itemId: it.id, cat: it.cat, unit: it.unit, qty: it.stdQty || 1 }, true); }
    await DB.put("items", n);
  },
  async ensure(name, extra) {
    let it = this.byName(name);
    if (!it) { it = { name: name.trim(), cat: (extra && extra.cat) || guessCat(name), unit: (extra && extra.unit) || "un", status: "ok", history: [], outs: [], track: true }; await DB.put("items", it, true); }
    return it;
  }
};

const Shop = {

  pendingRequests() { return DB.all("requests").filter((r) => r.status === "pendente"); },
  async add(o, quiet) {
    if (!o.name || !o.name.trim()) return;
    if (isChild() && !childCtl().addDirect) return Requests.create({ name: o.name, kind: "preciso", note: o.note || "" });

    const exists = this.open().find((s) => norm(s.name) === norm(o.name));
    if (exists) { if (!quiet) toast(tt("Já está na lista.", "Already on the list.")); return exists; }
    const nm = o.name.trim(); const doc = Object.assign({ qty: 1, unit: (it && it.unit) || "un", cat: (it && it.cat) || guessCat(o.name), done: false, itemId: it ? it.id : null }, o, { name: it ? it.name : nm.charAt(0).toUpperCase() + nm.slice(1) });

  },
  stores() { return [...new Set(DB.all("prices").map((p) => p.store).concat(DB.all("purchases").map((p) => p.store)).filter(Boolean))].sort(); },
  lastPrice(name, store) {
    const n = norm(name);
    const ps = DB.all("prices").filter((p) => norm(p.item) === n && (!store || p.store === store)).sort((a, b) => String(b.date).localeCompare(a.date));

    const m = modal({ title: "🧾 " + tt("Finalizar compra", "Finish shopping"), wide: true, body:
      '<div class="fgrid"><label class="fld"><span>' + tt("Onde comprou", "Store") + '</span><input type="text" id="fs" list="dlst" value="' + esc(DB.setting().lastStore || "") + '"><datalist id="dlst">' + stores.map((x) => '<option value="' + esc(x) + '">').join("") + "</datalist></label>" +
      '<label class="fld"><span>' + tt("Data", "Date") + '</span><input type="date" id="fd" value="' + today() + '"></label>' +
      '<label class="fld"><span>' + tt("Forma de pagamento", "Payment") + '</span><select id="fp">' + PAYS.map((p) => '<option value="' + p[0] + '"' + (DB.setting().lastPay === p[0] ? " selected" : "") + ">" + p[1] + "</option>").join("") + "</select></label>" +
      '<label class="fld"><span>' + tt("Total pago (R$)", "Total paid (R$)") + '</span><input type="text" inputmode="decimal" id="ft" placeholder="' + tt("soma automática", "auto sum") + '"></label>' +
      '<div class="full"><div class="grouph">' + tt("Preço de cada item (opcional — ensina o app onde é mais barato)", "Price per item (optional — teaches the app where it's cheaper)") + '</div><div class="list">' + rows + "</div></div>" +
      '<label class="check full"><input type="checkbox" id="fmt"' + (mt.enabled ? " checked" : "") + "> 💰 " + tt("Enviar este gasto para o MoneyTrio (BudgetONE)", "Send this expense to MoneyTrio (BudgetONE)") + "</label></div>",
      foot: '<button class="btn ghost" data-x>' + tt("Cancelar", "Cancel") + '</button><button class="btn ok" data-ok>✓ ' + tt("Concluir", "Done") + "</button>" });
    const sum = () => $$("[data-pr]", m.el).reduce((a, i) => a + parseNum(i.value), 0);

/* ---------- pedidos (filhos → aprovação dos responsáveis) ---------- */
const Points = {
  balance(pid) {
    const earned = DB.all("tasks").filter((t) => t.done && (t.assignee || t.doneBy) === pid && t.points && t.approved !== false).reduce((a, t) => a + (+t.points || 0), 0);
    const bonus = DB.all("people").find((p) => p.id === pid);
    const spent = DB.all("requests").filter((r) => r.by === pid && r.redeemed).reduce((a, r) => a + (+((r.goal || {}).points) || 0), 0);
    return earned + (+((bonus || {}).bonusPoints) || 0) - spent;
  }
};
const Requests = {
  async create(o) {

    if (S.mode !== "cloud" || true) Notify.ntfy(tt("Novo pedido de ", "New request from ") + People.name(S.meId), o.name);
    return doc;
  },
  async approve(id, goal) {

function parseQtyName(txt) {
  const m = /^(.*?)[\s×x]*(\d+(?:[.,]\d+)?)\s*(un|kg|g|l|ml|pct|cx|dz|latas?|garrafas?)?$/i.exec(txt.trim());
  if (m && m[1].trim()) return { name: m[1].trim(), qty: parseNum(m[2]), unit: (m[3] || "").toLowerCase() || undefined };
  const m2 = /^(\d+(?:[.,]\d+)?)\s*(un|kg|g|l|ml|pct|cx|dz)?\s+(?:de\s+)?(.+)$/i.exec(txt.trim());
  if (m2) return { name: m2[3].trim(), qty: parseNum(m2[1]), unit: (m2[2] || "").toLowerCase() || undefined };
  return { name: txt.trim() };
}

const Agenda = {
  occurrences(from, to, opts) {
    opts = opts || {};
    const out = [];
    DB.all("events").forEach((e) => {
      if (!e.date) return;
      const rep = e.repeat || "none"; const until = e.until || "9999-12-31";
      const push = (d) => { if (d >= from && d <= to && d <= until && !(e.skip || []).includes(d)) out.push(Object.assign({}, e, { date: d, baseDate: e.date })); };
      if (rep === "none") push(e.date);
      else if (rep === "daily") { let d = e.date < from ? from : e.date; while (d <= to) { push(d); d = addDays(d, 1); } }
      else if (rep === "weekly") { let d = e.date; if (d < from) { const k = Math.ceil(diffDays(d, from) / 7); d = addDays(d, k * 7); } while (d <= to) { push(d); d = addDays(d, 7); } }
      else if (rep === "monthly" || rep === "yearly") {
        const b = parseISO(e.date); let y = parseISO(from).getFullYear(), m = parseISO(from).getMonth();
        if (rep === "yearly") m = b.getMonth();
        for (let i = 0; i < (rep === "monthly" ? 14 : 3); i++) {
          const dd = new Date(y, m, b.getDate()); const d = isoDate(dd);
          if (dd.getDate() === b.getDate() && d >= e.date) push(d);
          if (rep === "monthly") { m++; if (m > 11) { m = 0; y++; } } else y++;
        }
      }
    });
    if (opts.birthdays !== false) People.list().forEach((p) => {
      if (!p.birth) return; const b = parseISO(p.birth);
      for (let y = parseISO(from).getFullYear(); y <= parseISO(to).getFullYear(); y++) {
        const d = isoDate(new Date(y, b.getMonth(), b.getDate()));
        if (d >= from && d <= to) out.push({ id: "bday-" + p.id, virtual: true, title: "🎂 " + tt("Aniversário de ", "Birthday: ") + (p.nick || p.name) + " (" + (y - b.getFullYear()) + ")", date: d, cat: "aniversario", members: [p.id], allDay: true });
      }
    });
    if (opts.extras) {
      Maint.list().forEach((m) => { if (m.next && m.next >= from && m.next <= to) out.push({ id: "mt-" + m.id, virtual: true, title: "🛠 " + m.title, date: m.next, cat: "casa", allDay: true }); });
      DB.all("docs").forEach((d) => { if (d.expires && d.expires >= from && d.expires <= to) out.push({ id: "dc-" + d.id, virtual: true, title: "📄 " + tt("Vence: ", "Expires: ") + d.title, date: d.expires, cat: "outro", allDay: true }); });
    }
    return out.sort((a, b) => (a.date + (a.time || "00:00")).localeCompare(b.date + (b.time || "00:00")));
  },
  gcalLink(e) {
    const d = e.date.replace(/-/g, "");
    let dates;
    if (e.time && !e.allDay) { const st = d + "T" + e.time.replace(":", "") + "00"; const en = d + "T" + (e.end || addHour(e.time)).replace(":", "") + "00"; dates = st + "/" + en; }

const Load = {
  compute(days) {

    ppl.forEach((p) => (res[p.id] = { plan: 0, exec: 0, cats: {} }));
    const add = (pid, k, cat) => { if (!pid || !res[pid]) return; res[pid][k]++; if (cat) res[pid].cats[cat] = (res[pid].cats[cat] || 0) + 1; };
    ["tasks", "events", "shop", "maint", "contacts", "docs", "routine", "items", "guides", "things"].forEach((c) => DB.raw(c).forEach((d) => { if (d.createdAt >= from && !d.virtual) add(d.createdBy, "plan", c); }));
    DB.raw("requests").forEach((r) => { if (r.decidedAt && r.decidedAt >= from) add(r.decidedBy, "plan", "requests"); });
    DB.raw("tasks").forEach((t) => { if (t.done && t.doneAt >= from) add(t.doneBy, "exec", t.cat || "outro"); });
    DB.raw("shop").forEach((s) => { if (s.done && s.doneAt >= from) add(s.doneBy, "exec", "compras"); });
    DB.raw("purchases").forEach((p) => { if ((p.createdAt || p.date) >= from) { add(p.by, "exec", "compras"); res[p.by] && (res[p.by].exec += Math.floor((p.items || []).length / 4)); } });
    DB.raw("maint").forEach((m) => (m.history || []).forEach((h) => { if (h.d >= from.slice(0, 10)) add(h.by, "exec", "casa"); }));
    return res;
  }
};

const Handover = {
  timeline(ho) {
    const now = new Date(); const end = ho && ho.until ? new Date(Math.min(parseISO(ho.until).getTime(), now.getTime() + 48 * 3600e3)) : new Date(now.getTime() + 48 * 3600e3);
    const d0 = today(), d2 = addDays(d0, 2); const out = [];
    const nowKey = d0 + " " + pad(now.getHours()) + ":" + pad(now.getMinutes()); const endKey = isoDate(end) + " " + pad(end.getHours()) + ":" + pad(end.getMinutes());
    const push = (date, time, ic, title, sub) => { const k = date + " " + (time || "00:00"); if (k >= nowKey && k <= endKey) out.push({ date, time: time || "", ic, title, sub, k }); };
    for (let d = d0; d <= d2; d = addDays(d, 1)) {
      Routine.on(d).forEach((r) => { const k = RT_KINDS().find((x) => x[0] === r.kind) || RT_KINDS()[6]; push(d, r.time, k[1], r.title, [r.who ? People.name(r.who) : "", r.notes].filter(Boolean).join(" · ")); });
      DB.all("health").forEach((h) => (h.meds || []).forEach((m) => (m.times || "").split(/[,;\s]+/).filter((t) => /^\d{1,2}:\d{2}$/.test(t)).forEach((t) => push(d, t.padStart(5, "0"), "💊", People.name(h.id) + ": " + m.name, m.dose || ""))));
      DB.all("tasks").filter((t) => Tasks.isOpen(t) && t.due === d).forEach((t) => push(d, "09:00", "✅", t.title, t.assignee ? "→ " + People.name(t.assignee) : ""));
    }
    Agenda.occurrences(d0, d2).forEach((e) => push(e.date, e.time || "07:00", evCat(e.cat).ic, e.title, [e.place, (e.members || []).map((m) => People.name(m)).join(", ")].filter(Boolean).join(" · ")));
    return out.sort((a, b) => a.k.localeCompare(b.k));
  },
  contacts() {
    const ho = DB.setting().handover || {};
    const pick = DB.all("contacts").filter((c) => (ho.contactIds || []).includes(c.id) || c.fav || ["emergencia", "saude", "escola"].includes(c.cat));
    return pick.slice(0, 14);
  },
  text() {
    const ho = DB.setting().handover || {};
    const L = ["🔁 " + tt("ASSUME A CASA", "HANDOVER") + " — " + People.name(ho.to), tt("Até ", "Until ") + fmtDate((ho.until || "").slice(0, 10)) + " " + fmtTime((ho.until || "").slice(11, 16))];
    if (ho.note) L.push("", "📝 " + ho.note);
    L.push("", "⏱ " + tt("PRÓXIMAS 48H", "NEXT 48H"));
    this.timeline(ho).forEach((x) => L.push(relDay(x.date) + " " + fmtTime(x.time) + " — " + x.title + (x.sub ? " (" + x.sub + ")" : "")));
    L.push("", "📞 " + tt("CONTATOS", "CONTACTS"));
    this.contacts().forEach((c) => L.push(c.name + ((c.phones || [])[0] ? ": " + c.phones[0] : "")));
    L.push("", "💊 " + tt("SAÚDE", "HEALTH"));
    People.list().forEach((p) => { const h = DB.get("health", p.id); if (!h) return; const al = (h.allergies || []).map((a) => a.what).filter(Boolean); if (al.length || (h.meds || []).length) L.push((p.nick || p.name) + ": " + [al.length ? tt("alergia a ", "allergic to ") + al.join(", ") : "", (h.meds || []).map((m) => m.name + " " + (m.times || "")).join("; ")].filter(Boolean).join(" · ")); });
    return L.join("\n");
  }
};

  parseVcf(txt) {
    const out = []; txt.replace(/\r\n[ \t]/g, "").split(/BEGIN:VCARD/i).slice(1).forEach((card) => {

function guessCtCat(c) {
  const s = norm((c.name || "") + " " + (c.org || ""));
  if (/escola|colegio|creche|bercario|professor|coordena|school/.test(s)) return "escola";
  if (/dr\.? |dra\.? |pediatra|clinica|hospital|medic|dentista|laborat|psicolog|fisio|farmacia|unimed|amil|bradesco saude|sulamerica|hapvida/.test(s)) return "saude";
  if (/encanador|eletricista|diarista|faxin|pedreiro|pintor|jardin|chaveiro|gas |gás|marido de aluguel|tecnico|técnico|manutenc|portaria|zelador|sindico/.test(s)) return "casa";
  if (/advog|contador|contab|juridic|cartorio/.test(s)) return "juridico";
  if (/banco|seguro|corretor|gerente|itau|bradesco|caixa|santander|nubank|inter\b/.test(s)) return "financeiro";
  if (/vizinh|apto|apartamento/.test(s)) return "vizinhos";
  if (/vet|petshop|pet shop|banho e tosa/.test(s)) return "pet";
  if (/mae|pai|vo|vó|avo|avó|tia|tio|prim|irma|irmã|cunhad|sogr/.test(s)) return "familia";
  return "outro";
}

/* ---------- leitor de texto bagunçado (e-mail da escola, WhatsApp, bilhete) ---------- */
const MONTHS_RX = "janeiro|fevereiro|mar[cç]o|abril|maio|junho|julho|agosto|setembro|outubro|novembro|dezembro|jan|fev|mar|abr|mai|jun|jul|ago|set|out|nov|dez";
const Parser = {
  monthIdx(s) { const n = norm(s).slice(0, 3); return ["jan", "fev", "mar", "abr", "mai", "jun", "jul", "ago", "set", "out", "nov", "dez"].indexOf(n); },
  fixYear(d, m, y) { const t = new Date(); if (y) { y = +y; if (y < 100) y += 2000; return new Date(y, m, d); } let dt = new Date(t.getFullYear(), m, d); if (diffDays(isoDate(t), isoDate(dt)) < -20) dt = new Date(t.getFullYear() + 1, m, d); return dt; },
  local(text) {
    const r = { emails: [], phones: [], orgs: [], cep: "", address: "", people: [], events: [], names: [] };
    const T = String(text || "");
    r.emails = [...new Set((T.match(/[\w.+-]+@[\w-]+(\.[\w-]+)+/g) || []).map((x) => x.toLowerCase()))];
    r.phones = [...new Set((T.match(/(?:\+?55\s?)?\(?\d{2}\)?[\s.-]?9?\s?\d{4}[\s.-]?\d{4}\b/g) || []).map((x) => x.trim()).filter((x) => { const d = onlyDigits(x); return d.length >= 10 && d.length <= 13; }))];
    const cep = T.match(/\b\d{5}-?\d{3}\b/); if (cep) r.cep = cep[0];
    const addr = T.match(/\b(Rua|R\.|Avenida|Av\.?|Alameda|Al\.|Travessa|Tv\.|Estrada|Rodovia|Pra[çc]a|Largo)\s+[^\n;]{3,80}/i); if (addr) r.address = addr[0].replace(/\s+/g, " ").trim().replace(/[.,]$/, "");
    const orgRx = /\b(Escola|Col[eé]gio|Creche|Ber[çc]ário|Cl[ií]nica|Hospital|Consult[óo]rio|Laborat[óo]rio|Academia|Condom[ií]nio|Prefeitura|Secretaria|Instituto|Faculdade|Universidade|Buffet|Igreja|Centro|Espa[çc]o|Associa[çc][ãa]o|UBS|UPA)\s+(?:(?:de|da|do|dos|das|e)\s+)?[A-ZÀ-Ú0-9][\wÀ-ú'.-]*(?:\s+(?:(?:de|da|do|dos|das|e)\s+)?[A-ZÀ-Ú0-9][\wÀ-ú'.-]*){0,5}/g;
    r.orgs = [...new Set((T.match(orgRx) || []).map((s) => s.trim()))];
    r.people = Parser.peopleIn(T);
    const drx = new RegExp("\\b(\\d{1,2})[\\/.-](\\d{1,2})(?:[\\/.-](\\d{2,4}))?\\b|\\b(\\d{1,2})\\s*(?:de\\s+)?(" + MONTHS_RX + ")\\.?(?:\\s*(?:de\\s+)?(\\d{4}))?\\b|\\b(hoje|amanh[ãa]|depois de amanh[ãa])\\b|\\b(?:pr[óo]xim[ao]\\s+)?(segunda|ter[çc]a|quarta|quinta|sexta|s[áa]bado|domingo)(?:-feira)?\\b", "gi");
    const sentences = T.split(/(?<=[.!?\n])\s+|\n+/).map((s) => s.trim()).filter(Boolean);
    const seen = new Set();
    sentences.forEach((sn) => {
      drx.lastIndex = 0; let m;
      while ((m = drx.exec(sn))) {
        let dt = null;
        if (m[1] && m[2]) { const d = +m[1], mo = +m[2] - 1; if (d < 1 || d > 31 || mo < 0 || mo > 11) continue; dt = Parser.fixYear(d, mo, m[3]); }
        else if (m[4] && m[5]) { const mo = Parser.monthIdx(m[5]); if (mo < 0) continue; dt = Parser.fixYear(+m[4], mo, m[6]); }
        else if (m[7]) { const w = norm(m[7]); dt = new Date(); if (w.startsWith("amanh")) dt.setDate(dt.getDate() + 1); if (w.startsWith("depois")) dt.setDate(dt.getDate() + 2); }
        else if (m[8]) { const idx = ["domingo", "segunda", "terca", "quarta", "quinta", "sexta", "sabado"].indexOf(norm(m[8])); if (idx < 0) continue; if (/\d{1,2}[\/.-]\d{1,2}/.test(sn)) continue; dt = new Date(); let add = (idx - dt.getDay() + 7) % 7; if (add === 0) add = 7; dt.setDate(dt.getDate() + add); }
        if (!dt || isNaN(dt)) continue;
        const date = isoDate(dt);
        const tm = sn.match(/(?:[àa]s\s+|a partir das\s+|das\s+)?\b(\d{1,2})\s*(?:h|:)\s*(\d{2})?\s*(?:h|min)?\b/i);
        let time = ""; if (tm && +tm[1] < 24 && !(tm.index > 0 && /\d[\/.-]$/.test(sn.slice(0, tm.index)))) time = pad(+tm[1]) + ":" + pad(+(tm[2] || 0));
        const kw = sn.match(/\b(reuni[aã]o(?: de pais| pedag[oó]gica| de (?:turma|condom[ií]nio))?|festa(?: d[aoe]s?)?(?: [A-ZÀ-Ú][\wÀ-ú]+){0,3}|festa junina|passeio(?: (?:a|ao|à|pelo|pela|no|na) [\wÀ-ú]+(?: [A-ZÀ-Ú][\wÀ-ú]+)?)?|excurs[aã]o(?: (?:a|ao|à|para) [\wÀ-ú]+)?|prova(?: de [\wÀ-ú]+)?|simulado|apresenta[cç][aã]o(?: d[aeo]s? [\wÀ-ú]+)?|formatura|vacina[cç][aã]o|vacina(?: [\wÀ-ú]+)?|consulta(?: com [\wÀ-ú. ]{2,25})?|entrega d[aeo]s? [\wÀ-ú]+|feira(?: d[aeo]s? [\wÀ-ú]+)?|palestra|campeonato|jogo|anivers[aá]rio(?: d[aeo] [A-ZÀ-Ú][\wÀ-ú]+)?|matr[ií]cula|rematr[ií]cula|conselho de classe|plant[aã]o de d[uú]vidas|semana de provas|dia d[aoe]s? [\wÀ-ú]+|aula(?: de [\wÀ-ú]+)?|recital|missa|culto|casamento|batizado|churrasco|viagem|mudan[cç]a)/i);
        let title = kw ? Parser.trimTitle(kw[1]) : sn.replace(new RegExp(drx.source, "gi"), " ").replace(/(?:[àa]s\s+|das\s+)?\b\d{1,2}\s*(?:h|:)\s*\d{0,2}\s*(?:h|min)?\b/gi, " ").replace(/\b(dia|no dia|na|no|em|até|ate|próxima|proxima|de)\s*$/i, "").replace(/\s{2,}/g, " ").replace(/^[\s,;:–-]+|[\s,;:–-]+$/g, "");
        if (title.length > 80) title = title.slice(0, 77) + "…";
        const key = date + "|" + time + "|" + norm(title).slice(0, 20); if (seen.has(key)) continue; seen.add(key);
        if (!kw) title = title.replace(/^(?:[AO]s?\s+)?(?:[A-ZÀ-Ú][\wÀ-ú]*\s+){0,6}(?:informa|comunica|avisa|lembra|convida)\s+(?:que\s+)?/i, "");
        title = title.charAt(0).toUpperCase() + title.slice(1);
        const t2 = sn.match(/(?:[àa]s|at[ée])\s+(\d{1,2})\s*(?:h|:)\s*(\d{2})?/gi);
        let end = ""; if (time && t2 && t2.length) { const mm = /(\d{1,2})\s*(?:h|:)\s*(\d{2})?/.exec(t2[t2.length - 1]); const e2 = pad(+mm[1]) + ":" + pad(+(mm[2] || 0)); if (e2 > time) end = e2; }
        const org = (r.orgs[0] && !norm(title).includes(norm(r.orgs[0]).split(" ").slice(-1)[0])) ? r.orgs[0] : "";
        r.events.push({ title: (title || tt("Compromisso", "Event")) + (org && kw ? " — " + org : ""), date, time, end, people: Parser.peopleIn(sn), notes: sn.length > 200 ? sn.slice(0, 200) + "…" : sn });
      }
    });
    return r;
  },
  trimTitle(k) {
    const STOPW = new Set("acontece sera será vai tem tera terá no na em nos nas para com que e ocorrera ocorrerá havera haverá esta está sao são foi dia sera".split(" "));
    const w = k.trim().split(/\s+/); const out = [w[0]];
    for (let i = 1; i < w.length && out.length < 7; i++) { if (STOPW.has(norm(w[i]))) break; out.push(w[i]); }
    while (out.length > 1 && /^(de|da|do|das|dos|a|ao|à|o|as|os)$/i.test(out[out.length - 1])) out.pop();
    const t = out.join(" "); return t.charAt(0).toUpperCase() + t.slice(1);
  },
  peopleIn(text) { return People.matchName(text).map((p) => p.id); },
  async ai(text, image) {

      ". " + tt("Responda somente JSON: {\"instituicao\":\"\",\"contatos\":[{\"nome\":\"\",\"org\":\"\",\"funcao\":\"\",\"email\":\"\",\"telefone\":\"\",\"endereco\":\"\"}],\"pessoas_da_familia\":[\"\"],\"eventos\":[{\"titulo\":\"\",\"data\":\"AAAA-MM-DD\",\"hora\":\"HH:MM\",\"local\":\"\",\"para_quem\":[\"\"],\"levar\":\"\"}],\"tarefas\":[\"\"]}", "Reply only JSON: {\"instituicao\":\"\",\"contatos\":[{\"nome\":\"\",\"org\":\"\",\"funcao\":\"\",\"email\":\"\",\"telefone\":\"\",\"endereco\":\"\"}],\"pessoas_da_familia\":[\"\"],\"eventos\":[{\"titulo\":\"\",\"data\":\"YYYY-MM-DD\",\"hora\":\"HH:MM\",\"local\":\"\",\"para_quem\":[\"\"],\"levar\":\"\"}],\"tarefas\":[\"\"]}") + "\n\n" + (text || "");

      events: (j.eventos || []).filter((e) => /^\d{4}-\d{2}-\d{2}$/.test(e.data || "")).map((e) => ({ title: e.titulo || tt("Compromisso", "Event"), date: e.data, time: /^\d{2}:\d{2}$/.test(e.hora || "") ? e.hora : "", place: e.local || "", notes: e.levar ? tt("Levar: ", "Bring: ") + e.levar : "", people: (e.para_quem || []).map(find).filter(Boolean) })),

  toContact(r) {

const Where = {
  places() { return DB.all("places"); },
  children(pid) { return this.places().filter((p) => (p.parent || "") === (pid || "")).sort((a, b) => String(a.name).localeCompare(b.name)); },
  things(pid) { return DB.all("things").filter((t) => t.place === pid).sort((a, b) => String(a.name).localeCompare(b.name)); },
  path(pid) { const out = []; let p = DB.get("places", pid); let guard = 0; while (p && guard++ < 12) { out.unshift(p); p = p.parent ? DB.get("places", p.parent) : null; } return out; },
  pathTxt(pid) { return this.path(pid).map((p) => p.name).join(" › "); },

  descendants(pid) { const out = []; const walk = (id) => this.children(id).forEach((c) => { out.push(c.id); walk(c.id); }); walk(pid); return out; },
  search(q) {
    const toks = norm(q).split(/[^a-z0-9]+/).filter((t) => t && !STOP.has(t) && t.length > 1);
    if (!toks.length) return [];
    const score = (txt) => { const n = norm(txt); let s = 0; toks.forEach((t) => { if (n.includes(t)) s += t.length > 3 ? 2 : 1; else if (t.length > 4 && n.includes(t.slice(0, -1))) s += 1; }); return s; };

    Pantry.items().forEach((i) => { if (!i.where) return; const s = score(i.name) * 1.5; if (s >= toks.length) res.push({ s, type: "item", ic: "🥫", title: i.name, path: i.where, sub: tt("despensa", "pantry"), id: i.id }); });
    return res.sort((a, b) => b.s - a.s).slice(0, 30);
  }

const TimeWheel = {

  set(root, hhmm) { const [h, m] = String(hhmm).split(":").map(Number); const cs = $$(".twcol", root); cs[0].scrollTop = h * this.H; cs[1].scrollTop = m * this.H; },
  get(root) { const cs = $$(".twcol", root); const v = (c, mx) => Math.max(0, Math.min(mx, Math.round(c.scrollTop / this.H))); return pad(v(cs[0], 23)) + ":" + pad(v(cs[1], 59)); },
  bind(root, on) {

      c.addEventListener("click", (e) => { const i = e.target.closest(".twi"); if (i) c.scrollTo({ top: $$(".twi", c).indexOf(i) * this.H, behavior: "smooth" }); });
      c.addEventListener("keydown", (e) => { if (e.key === "ArrowUp" || e.key === "ArrowDown") { e.preventDefault(); c.scrollTop += (e.key === "ArrowUp" ? -1 : 1) * this.H; } });

  }
};

  const quiet = setTimeout(() => { if (!heard && !done) say("🤔 " + tt("Ainda não ouvi nada. Confira o microfone — ou toque em ✓ OK para parar.", "Nothing heard yet. Check the mic — or tap ✓ OK to stop.")); }, 7000);
  r.onaudiostart = () => say("🎙️ " + tt("Microfone ligado. Pode falar.", "Mic on. Go ahead."));
  r.onresult = (e) => { heard = true; inter = ""; for (let i = e.resultIndex; i < e.results.length; i++) { if (e.results[i].isFinal) fin += (fin ? " " : "") + e.results[i][0].transcript.trim(); else inter += e.results[i][0].transcript; } input.value = (base + " " + fin + " " + inter).replace(/\s+/g, " ").trim(); say("🎙️ " + tt("Ouvindo…", "Listening…")); };
  r.onerror = (e) => end(e.error);
  r.onend = () => end();
  okb.onclick = (e) => { e.preventDefault(); e.stopPropagation(); if (Voice.cur) Voice.cur.finish(); };
  try { r.start(); } catch (e) { end("start"); }
};

  remember(st) { Cheguei.save({ to: st.to, pick: st.pick.filter((k) => !st.extra.some((c) => k === "m:" + c.id)), ch: st.ch }); },
  pushTo(st) { if (!st.ch.includes("push")) return []; return st.to === "all" ? "all" : this.targets(st).filter((t) => t.pid).map((t) => t.pid); },
  /* envia: automático onde o canal está configurado; o resto vira botões de um toque */
  async dispatch(st, text, subject, link) {

/* ---------- lugares do Cheguei ---------- */
const CHK_PLACE_LIST = () => [["🏠", tt("Casa", "Home")], ["🎒", tt("Escola", "School")], ["📚", tt("Curso", "Class")], ["💼", tt("Trabalho", "Work")], ["👵", tt("Casa dos avós", "Grandparents' home")], ["🧑‍🤝‍🧑", tt("Casa de amigos", "Friends' home")], ["🍻", "Bar"], ["🍽️", tt("Restaurante", "Restaurant")], ["🏋️", tt("Academia", "Gym")], ["🛍️", "Shopping"], ["✈️", tt("Aeroporto", "Airport")], ["🚌", tt("Rodoviária", "Bus station")], ["🚇", tt("Metrô", "Subway")], ["🏥", tt("Hospital", "Hospital")]];
const CHK_PLACES = () => CHK_PLACE_LIST().map((x) => x[1]);
const CHK_OTHER = () => tt("Outro", "Other");
const Cheguei = {
  cfg() { return Object.assign({ sel: [], gps: true }, S.prefs.cheguei || {}); },
  save(p) { S.prefs.cheguei = Object.assign(this.cfg(), p); savePrefs(); },
  list() { return DB.all("checkins").sort((a, b) => String(b.at).localeCompare(a.at)); },
  expects() { return DB.all("expects").filter((e) => e.active !== false); },
  /* horário esperado de hoje (ou null se não vale hoje) */
  dueToday(e) {
    const td = today();
    if (e.date) return e.date === td ? td + "T" + e.time : null;
    const days = (e.days || []).map(Number);
    return !days.length || days.includes(parseISO(td).getDay()) ? td + "T" + e.time : null;
  },
  /* chegou? = um “cheguei” da pessoa, no lugar (se houver), desde 4 h antes do horário */
  arrival(pid, place, dueIso) {
    const from = new Date(parseISO(dueIso).getTime() - 4 * 3600e3).toISOString();
    const p = norm(place || "");
    return this.list().find((c) => c.type === "cheguei" && c.by === pid && c.at >= from && (!p || norm(c.place).includes(p) || p.includes(norm(c.place))));
  },
  /* situação de tudo que está sendo esperado agora: horários marcados + “estou saindo” */
  pending() {
    const out = []; const now = Date.now();
    this.expects().forEach((e) => {
      const due = this.dueToday(e); if (!due) return;
      const t = parseISO(due).getTime(); const arr = this.arrival(e.person, e.place, due);
      const late = !arr && now > t + (+e.tol || 15) * 60000;
      if (now > t - 3 * 3600e3) out.push({ kind: "expect", id: e.id, key: e.id + "|" + due, person: e.person, place: e.place, due, arr, late, tol: +e.tol || 15, sel: e.sel });
    });
    this.list().filter((c) => c.type === "saindo" && c.eta && now - parseISO(c.eta).getTime() < 12 * 3600e3).forEach((c) => {
      const arr = this.list().find((a) => a.type === "cheguei" && a.by === c.by && a.at > c.at);
      const late = !arr && now > parseISO(c.eta).getTime() + 15 * 60000;
      out.push({ kind: "trip", id: c.id, key: c.id, person: c.by, place: c.to, due: c.eta, arr, late, tol: 15 });
    });
    return out.sort((a, b) => a.due.localeCompare(b.due));
  },
  statusTxt(x) {

/* =====================================================================
   RECADOS (caixa de recados entre as pessoas da família)
   Na nuvem (Firebase) o recado chega no celular de quem recebe; no modo
   "só neste aparelho" ele fica para a pessoa ver quando entrar no perfil dela.
   ===================================================================== */
const PRIOS = () => [["urgente", "🔴", tt("Urgente", "Urgent")], ["importante", "🟡", tt("Importante", "Important")], ["fyi", "🔵", tt("Para saber", "FYI")]];
const prioInfo = (k) => { const p = PRIOS().find((x) => x[0] === k) || PRIOS()[2]; return { k: p[0], ic: p[1], t: p[2] }; };
const PRIO_ORDER = { urgente: 0, importante: 1, fyi: 2 };
const REPEATS = () => [["none", tt("Não repete", "Doesn't repeat")], ["daily", tt("Todo dia", "Daily")], ["weekly", tt("Toda semana", "Weekly")], ["monthly", tt("Todo mês", "Monthly")]];
const Msgs = {
  /* chave da vez atual do recado (a data da última repetição). null = ainda não chegou.
     Recado que repete volta a ficar "não lido" a cada nova vez. */
  occ(m, d) {
    d = d || today();
    const st = m.start || String(m.createdAt || "").slice(0, 10) || d;

async function backupJSON(withFiles) {
  const out = { app: APP_NAME, v: 1, at: new Date().toISOString(), data: {} };
  COLS.forEach((c) => (out.data[c] = DB.raw(c)));
  if (withFiles) { out.files = {}; for (const m of DB.raw("files")) { try { const b = await DB.driver.getFile(m.id, m); if (b) out.files[m.id] = await blobToB64(b); } catch (e) {} } }
  return JSON.stringify(out);
}

ACT["drive.backup"] = async () => {
  if (S.mode !== "cloud" || !FB.auth || !FB.auth.currentUser) return toast(tt("Entre com Google (nuvem) para usar o Drive. Enquanto isso, use Dados → Exportar.", "Sign in with Google (cloud) to use Drive. Meanwhile use Data → Export."), 4500);
  const u = FB.auth.currentUser;
  if (!u.providerData.some((p) => p.providerId === "google.com")) return toast(tt("Disponível para quem entra com Google.", "Available for Google sign-in."));
  const prov = new FB.A.GoogleAuthProvider(); prov.addScope("https://www.googleapis.com/auth/drive.file");
  let res; try { res = await FB.A.reauthenticateWithPopup(u, prov); } catch (e) { return toast(Cloud.errMsg(e)); }
  const cred = FB.A.GoogleAuthProvider.credentialFromResult(res); const token = cred && cred.accessToken;
  if (!token) return toast(tt("O Google não liberou o acesso ao Drive.", "Google didn't grant Drive access."));
  toast(tt("Enviando para o Drive…", "Uploading to Drive…"));
  const form = new FormData();
  form.append("metadata", new Blob([JSON.stringify({ name: "OmniLifeONE-backup-" + today() + ".json", mimeType: "application/json" })], { type: "application/json" }));
  form.append("file", new Blob([await backupJSON(false)], { type: "application/json" }));
  try {
    const r = await fetch("https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart&fields=id,name", { method: "POST", headers: { Authorization: "Bearer " + token }, body: form });
    if (!r.ok) { const t = await r.text(); throw new Error(r.status === 403 ? tt("Ative a “Google Drive API” no Google Cloud do seu projeto Firebase (console.cloud.google.com → APIs → Ativar).", "Enable the Google Drive API in your Firebase project's Google Cloud.") : t.slice(0, 160)); }
    toast(tt("Backup salvo no seu Google Drive ✓", "Backup saved to your Google Drive ✓"), 4000);
  } catch (e) { toast(e.message, 7000); }
};
ACT["bk.import"] = async () => {
  const [f] = await Files.pick(".json,application/json"); if (!f) return;
  let o; try { o = JSON.parse(await f.text()); } catch (e) { return toast(tt("Arquivo inválido.", "Invalid file.")); }
  if (!o || !o.data) return toast(tt("Arquivo inválido.", "Invalid file."));
  if (!(await confirmBox(tt("Importar este backup? Registros com o mesmo código serão substituídos.", "Import this backup? Records with the same id will be replaced."), tt("Importar", "Import")))) return;
  let n = 0;
  for (const c of COLS) for (const doc of o.data[c] || []) { if (c === "vault" && !isGuardian()) continue; await DB.put(c, doc, true); n++; }
  for (const id in o.files || {}) { const m = DB.col("files").get(id); if (m) await DB.driver.putFile(id, b64ToBlob(o.files[id], m.enc ? "application/octet-stream" : m.type), m); }
  toast(n + tt(" registros importados ✓", " records imported ✓")); render();
};

/* =====================================================================
   INÍCIO DO APP
   ===================================================================== */
async function onAuth(u) {
  if (u) {
    if (lsGet(LS.mode, null) !== "cloud" && S.mode !== "cloud") return;
    S.mode = "cloud"; lsSet(LS.mode, "cloud");
    S.user = { uid: u.uid, name: u.displayName || "", email: u.email || "", photo: u.photoURL || "" };
    if (S.resolving || (S.booted && S.family)) return;
    S.resolving = true; ssSet("omnilife.adclosed", "");
    try { await Cloud.resolve(); } catch (e) { console.error(e); toast(Cloud.errMsg(e)); setGate("welcome"); }
    S.resolving = false;
  } else {
    S.user = null;
    if (S.mode === "cloud") { CloudDriver.stop(); S.family = null; S.data = {}; S.booted = false; setGate("welcome"); }
  }
}
async function boot() {
  loadPrefs(); document.documentElement.lang = S.lang === "pt" ? "pt-BR" : "en";
  staticTexts(); wireHeader(); Notify.init();
  if (/^#convite=/.test(location.hash)) {
    try { const o = unb64url(location.hash.slice(9)); if (o.c && !EMBEDDED_FIREBASE_CONFIG && !FB.has()) lsSet(LS.fbcfg, o.c); S.pendingInvite = o; lsSet(LS.mode, "cloud"); }
    catch (e) { toast(tt("Link de convite inválido.", "Invalid invite link.")); }
  }
  const mode = lsGet(LS.mode, null);
  if (mode === "local") { if (FB.has()) setTimeout(() => FB.init().catch(() => {}), 1500); return startLocal(); }
  if (mode === "advertiser") return ACT["gate.advertiser"]();
  if (mode === "cloud" && FB.has()) {
    S.mode = "cloud";
    setGate("loading", tt("Conectando à nuvem…", "Connecting to the cloud…"));
    try { await FB.init(); }
    catch (e) { console.error(e); toast("Firebase: " + (e.message || e)); setGate("welcome"); }
    setTimeout(() => { if (S.gate === "loading" && !S.user && !S.resolving) setGate("welcome"); }, 6000);
    return;
  }
  setGate("welcome");
  if (FB.has()) FB.init().catch((e) => console.warn("Firebase", e));
}
document.addEventListener("DOMContentLoaded", boot);
</script>
