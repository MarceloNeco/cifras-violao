<!DOCTYPE html>
<html lang="pt-BR" data-tema="claro">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CifrasONE</title>
<meta name="description" content="Cifras de violão com rolagem automática, mudança de tom e posições dos acordes.">
<meta name="theme-color" content="#a8501e">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icone-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="CifrasONE">
<link rel="stylesheet" href="estilo.css">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎸</text></svg>">
</head>
<body data-pagina="inicio">

<header class="topo">
  <div class="topo-interno"></div>
</header>

<main class="conteudo" data-dgo-ignorar>
  <div class="capa">
    <img src="capa.jpg" alt="" onerror="this.remove()">
    <div class="capa-texto">
      <h1 data-i18n="inicio.titulo">Minhas cifras</h1>
      <p data-i18n="inicio.sub">Busque pelo nome da música, pelo artista ou pelo trecho da letra.</p>
    </div>
  </div>

  <div class="caixa-busca">
    <svg class="lupa" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
      <circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/>
    </svg>
    <input id="busca" type="search" data-i18n-ph="inicio.busca" data-i18n-aria="inicio.buscaAria"
           autocomplete="off" aria-label="Buscar">
    <button class="limpar" id="limpar" data-i18n-aria="inicio.limpar" aria-label="Limpar busca">×</button>
  </div>

  <div class="filtros" id="filtros" role="group" data-i18n-aria="inicio.filtros" aria-label="Filtrar por categoria"></div>

  <p class="contagem" id="contagem"></p>
  <div class="lista" id="lista"></div>
</main>

<footer class="rodape" data-dgo-ignorar>
  <span data-i18n="inicio.rodape">Feito para tocar violão. As cifras são de uso pessoal.</span>
</footer>

<script src="idioma.js"></script>
<!-- Diretrizes gerais: idioma, anúncio, conta, avisos, nuvem e instalação.
     Estes dois arquivos são o padrão dos seus apps. O diretrizes.js é
     igual nos três; o que muda é só o diretrizes-config.js. -->
<script src="diretrizes.js"></script>
<script src="diretrizes-config.js"></script>
<script src="anuncios.js"></script>
<script src="acordes.js"></script>
<script src="comum.js"></script>
<script src="aviso.js"></script>
<script src="biblioteca.js"></script>
</body>
</html>
