<!DOCTYPE html>
<html lang="pt-BR" data-tema="claro">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Aviso — Cifras de Violão</title>
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#a8501e">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icone-192.png">
<link rel="stylesheet" href="estilo.css">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎸</text></svg>">
</head>
<body data-pagina="aviso">

<header class="topo">
  <div class="topo-interno"></div>
</header>

<!-- O texto vem do arquivo aviso.js, o mesmo que a janela do rodapé usa.
     Assim existe UM lugar só para corrigir o aviso. -->
<main class="conteudo texto-legal" id="corpo-aviso" data-dgo-ignorar></main>

<footer class="rodape" data-dgo-ignorar></footer>

<script src="idioma.js"></script>
<!-- Diretrizes gerais: idioma, anúncio, conta, avisos, nuvem e instalação.
     Estes dois arquivos são o padrão dos seus apps. O diretrizes.js é
     igual nos três; o que muda é só o diretrizes-config.js. -->
<script src="diretrizes.js"></script>
<script src="diretrizes-config.js"></script>
<script src="acordes.js"></script>
<script src="comum.js"></script>
<script src="aviso.js"></script>
<script>
  iniciarTema();
  function desenharAviso(){
    document.querySelector('#corpo-aviso').innerHTML = textoDoAviso() +
      '<p class="volta"><a class="botao" href="index.html">\u2190 <span data-i18n="topo.voltar">Voltar</span></a></p>';
    aplicarIdioma(document.querySelector('#corpo-aviso'));
    const form = document.querySelector('#form-remocao');
    if (form) form.addEventListener('submit', enviarPedido);
  }
  desenharAviso();
  document.addEventListener('idioma-mudou', ()=>{
    const alvo = document.querySelector('#corpo-aviso');
    if (alvo && !alvo.dataset.desenhando){
      alvo.dataset.desenhando = '1';
      alvo.innerHTML = textoDoAviso();
      delete alvo.dataset.desenhando;
    }
  });
</script>
</body>
</html>
