<!DOCTYPE html>
<html lang="pt-BR" data-tema="claro">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dicionário de acordes</title>
<meta name="description" content="Consulte qualquer acorde de violão: posições no braço, dedos e som.">
<meta name="theme-color" content="#a8501e">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icone-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="CifrasONE">
<link rel="stylesheet" href="estilo.css">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎸</text></svg>">
</head>
<body data-pagina="acordes">

<header class="topo">
  <div class="topo-interno"></div>
</header>

<main class="conteudo" data-dgo-ignorar>
  <div class="chamada">
    <h1 data-i18n="acordes.titulo">Dicionário de acordes</h1>
    <p data-i18n="acordes.sub">Digite qualquer acorde para ver como se faz no braço do violão.</p>
  </div>

  <div class="caixa-busca">
    <svg class="lupa" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
      <circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/>
    </svg>
    <input id="entrada" type="search" data-i18n-ph="acordes.entrada"
           autocomplete="off" autocapitalize="off" spellcheck="false" aria-label="Acorde">
  </div>

  <div class="escolhas">
    <div class="linha-escolha">
      <span class="rotulo" data-i18n="acordes.nota">Nota</span>
      <div class="pilha" id="notas"></div>
    </div>
    <div class="linha-escolha">
      <span class="rotulo" data-i18n="acordes.tipo">Tipo</span>
      <div class="pilha" id="tipos"></div>
    </div>
  </div>

  <section class="cartao-acorde" id="resultado" hidden></section>

  <section class="campo">
    <h2><span data-i18n="acordes.campo">Acordes do tom de</span> <select id="tom-campo" class="selecao"></select></h2>
    <p class="dica" data-i18n="acordes.campoDica">São os acordes que costumam aparecer juntos numa música nesse tom.</p>
    <div class="diagramas" id="campo-harmonico"></div>
  </section>
</main>

<footer class="rodape" data-dgo-ignorar>
  <span data-i18n="acordes.rodape">Toque em qualquer desenho para ouvir o acorde.</span>
</footer>

<script src="idioma.js"></script>
<!-- Diretrizes gerais (módulo comum SolverONE): idioma, anúncios, conta,
     avisos, nuvem, IA, AssistONE e instalação. O diretrizes.js é igual em
     todos os apps; o que muda é só o diretrizes-config.js. -->
<script src="diretrizes.js"></script>
<script src="diretrizes-config.js"></script>
<script src="acordes.js"></script>
<script src="comum.js"></script>
<script src="aviso.js"></script>
<script src="dicionario.js"></script>
</body>
</html>
